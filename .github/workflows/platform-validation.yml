name: Platform validation

on:
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-validation.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "platform/**"
      - ".github/workflows/platform-validation.yml"

permissions:
  contents: read

jobs:
  platform-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run platform tests
        run: npm test
      - name: Check source
        run: npm run check
