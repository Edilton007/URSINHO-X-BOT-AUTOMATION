name: Importar fonte auditada e validar URSINHO

on:
  push:
    branches: [main]
    paths:
      - "URSINHO-X-BOT-AUTOMATION-v1.1.2-AUDITORIA-01.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ursinho-import-main
  cancel-in-progress: false

jobs:
  import-and-validate:
    name: Importar v1.1.2, testar Backend e compilar APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar e extrair arquivo-fonte
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="URSINHO-X-BOT-AUTOMATION-v1.1.2-AUDITORIA-01.zip"
          test -f "$ARCHIVE" || { echo "::error::Falta enviar $ARCHIVE para a raiz do repositório."; exit 1; }

          python3 - <<'PY'
          import pathlib, zipfile, sys
          archive = pathlib.Path("URSINHO-X-BOT-AUTOMATION-v1.1.2-AUDITORIA-01.zip")
          root = "URSINHO-X-BOT-AUTOMATION-v1.1.2"
          required = {
              f"{root}/README.md",
              f"{root}/platform/package.json",
              f"{root}/platform/package-lock.json",
              f"{root}/android/agent/app/build.gradle.kts",
              f"{root}/android/tenant-app/app/build.gradle.kts",
          }
          forbidden_parts = {".git", "node_modules", "sessions", "downloads", "logs", "tmp"}
          with zipfile.ZipFile(archive) as z:
              names = set()
              for info in z.infolist():
                  p = pathlib.PurePosixPath(info.filename)
                  if p.is_absolute() or ".." in p.parts:
                      sys.exit(f"Entrada ZIP insegura: {info.filename}")
                  if not p.parts or p.parts[0] != root:
                      sys.exit(f"Entrada fora da pasta esperada: {info.filename}")
                  if forbidden_parts.intersection(p.parts):
                      sys.exit(f"Conteúdo operacional não permitido no ZIP: {info.filename}")
                  base = p.name
                  if (base == ".env" or (base.startswith(".env.") and base != ".env.example")
                      or p.suffix.lower() in {".apk", ".aab", ".jks", ".keystore", ".pem", ".p12", ".pfx"}):
                      sys.exit(f"Possível segredo ou binário de release no ZIP: {info.filename}")
                  if not info.is_dir():
                      names.add(info.filename)
              missing = required - names
              if missing:
                  sys.exit("Faltam ficheiros obrigatórios: " + ", ".join(sorted(missing)))

              manifest_path = f"{root}/SHA256SUMS.txt"
              if manifest_path not in names:
                  sys.exit("Manifesto SHA256 ausente.")
              verified = set()
              for line in z.read(manifest_path).decode("utf-8").splitlines():
                  try:
                      expected_hash, rel = line.split("  ", 1)
                  except ValueError:
                      sys.exit("Linha inválida no manifesto SHA256.")
                  rel = rel.removeprefix("./")
                  entry = pathlib.PurePosixPath(rel)
                  if entry.is_absolute() or ".." in entry.parts:
                      sys.exit(f"Caminho inseguro no manifesto: {rel}")
                  internal = f"{root}/{rel}"
                  if internal not in names or internal == manifest_path:
                      sys.exit(f"Ficheiro do manifesto não existe: {rel}")
                  actual_hash = __import__("hashlib").sha256(z.read(internal)).hexdigest()
                  if actual_hash != expected_hash:
                      sys.exit(f"SHA256 divergente: {rel}")
                  verified.add(internal)
              expected_files = names - {manifest_path}
              if verified != expected_files:
                  missing_hashes = expected_files - verified
                  extra_hashes = verified - expected_files
                  sys.exit(f"Manifesto incompleto/inconsistente. Sem hash: {sorted(missing_hashes)[:10]}, extras: {sorted(extra_hashes)[:10]}")
          print(f"Arquivo validado: {len(verified)} hashes SHA256 corretos e sem padrões de segredos proibidos.")
          PY

          rm -rf /tmp/ursinho-import
          mkdir -p /tmp/ursinho-import
          unzip -q "$ARCHIVE" -d /tmp/ursinho-import
          SRC="/tmp/ursinho-import/URSINHO-X-BOT-AUTOMATION-v1.1.2"
          test -f "$SRC/platform/package.json"
          rsync -a "$SRC/" ./
          rm -f "$ARCHIVE"

          # O preflight inclui higiene e deve correr antes de npm ci criar node_modules.
          cat > .github/workflows/backend-ci.yml <<'YAML'
          name: Backend validation

          on:
            push:
              branches: [main]
              paths:
                - "platform/**"
                - ".github/workflows/backend-ci.yml"
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: backend-validation-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            node-tests:
              name: Node.js 24
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: "24"
                    cache: npm
                    cache-dependency-path: platform/package-lock.json
                - name: Pré-validar antes de instalar dependências
                  working-directory: platform
                  run: npm run preflight
                - name: Instalar dependências bloqueadas
                  working-directory: platform
                  run: npm ci --ignore-scripts --no-audit --no-fund
                - name: Repetir testes após instalação
                  working-directory: platform
                  run: |
                    npm test
                    npm run check
          YAML

          cat > .github/workflows/android-build.yml <<'YAML'
          name: Android APKs

          on:
            push:
              branches: [main]
              paths:
                - "android/**"
                - ".github/workflows/android-build.yml"
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: android-build-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            build-apks:
              name: Testar Agent e compilar APKs
              runs-on: ubuntu-latest
              timeout-minutes: 45
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: "17"
                - uses: android-actions/setup-android@v3
                - name: Instalar Android SDK 35
                  run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
                - uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: "8.7"
                - name: Testar e compilar Android Agent
                  working-directory: android/agent
                  run: gradle testDebugUnitTest assembleDebug
                - name: Compilar Tenant App
                  working-directory: android/tenant-app
                  run: gradle assembleDebug
                - uses: actions/upload-artifact@v4
                  with:
                    name: URSINHO-X-APKs-DEBUG
                    path: |
                      android/agent/app/build/outputs/apk/debug/*.apk
                      android/tenant-app/app/build/outputs/apk/debug/*.apk
                    if-no-files-found: error
                    retention-days: 7
          YAML

          # Os workflows de CI foram atualizados acima; atualizar os hashes no manifesto auditável.
          python3 - <<'PY'
          import hashlib, pathlib
          manifest = pathlib.Path("SHA256SUMS.txt")
          if not manifest.is_file():
              raise SystemExit("Manifesto SHA256 não encontrado após a importação.")
          updated = []
          changed = {".github/workflows/backend-ci.yml", ".github/workflows/android-build.yml"}
          for line in manifest.read_text(encoding="utf-8").splitlines():
              digest, rel = line.split("  ", 1)
              clean = rel.removeprefix("./")
              if clean in changed:
                  digest = hashlib.sha256(pathlib.Path(clean).read_bytes()).hexdigest()
              updated.append(f"{digest}  {rel}")
          manifest.write_text("\\n".join(updated) + "\\n", encoding="utf-8")
          PY
          sha256sum -c SHA256SUMS.txt

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verificar higiene antes de publicar código no repositório público
        working-directory: platform
        run: node scripts/check-release-hygiene.js

      - name: Pré-validar Backend antes de instalar dependências
        working-directory: platform
        run: npm run preflight

      - name: Publicar a fonte completa no branch main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import URSINHO X BOT AUTOMATION v1.1.2 audited source"
            git push origin HEAD:main
          else
            echo "Não há alterações novas para publicar."
          fi

      - name: Ativar cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-${{ hashFiles('platform/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-

      - name: Instalar dependências bloqueadas
        working-directory: platform
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Repetir testes Node.js após instalar dependências
        working-directory: platform
        run: |
          npm test
          npm run check

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35 e Build Tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Testar e compilar Android Agent
        working-directory: android/agent
        run: gradle testDebugUnitTest assembleDebug

      - name: Compilar Tenant Android App
        working-directory: android/tenant-app
        run: gradle assembleDebug

      - name: Guardar APKs de teste
        uses: actions/upload-artifact@v4
        with:
          name: URSINHO-X-APKs-DEBUG-v1.1.2
          path: |
            android/agent/app/build/outputs/apk/debug/*.apk
            android/tenant-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
