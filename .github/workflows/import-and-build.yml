name: Importar fonte auditada e validar URSINHO

on:
  push:
    branches: [main]
    paths:
      - "URSINHO-X-BOT-AUTOMATION-v1.1.2-AUDITORIA-01.zip"
      - ".github/workflows/import-and-build.yml"
      - "android/**"
      - "platform/**"
      - "docs/ci-templates/**"
      - "SHA256SUMS.txt"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ursinho-import-main
  cancel-in-progress: false

jobs:
  import-and-validate:
    name: Importar v1.1.2, testar Backend e compilar APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar e extrair arquivo-fonte
        if: hashFiles('URSINHO-X-BOT-AUTOMATION-v1.1.2-AUDITORIA-01.zip') != ''
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="URSINHO-X-BOT-AUTOMATION-v1.1.2-AUDITORIA-01.zip"
          test -f "$ARCHIVE" || { echo "::error::Falta enviar $ARCHIVE para a raiz do repositório."; exit 1; }

          python3 - <<'PY'
          import pathlib, zipfile, sys, hashlib
          archive = pathlib.Path("URSINHO-X-BOT-AUTOMATION-v1.1.2-AUDITORIA-01.zip")
          expected_archive_sha256 = "65179d4d7980163b0d53d4a56398cbeda41d41a324a05917e2faf2aed38d45e4"
          actual_archive_sha256 = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual_archive_sha256 != expected_archive_sha256:
              sys.exit("SHA256 do ZIP não corresponde ao pacote auditado autorizado.")
          root = "URSINHO-X-BOT-AUTOMATION-v1.1.2"
          required = {
              f"{root}/README.md",
              f"{root}/platform/package.json",
              f"{root}/platform/package-lock.json",
              f"{root}/android/agent/app/build.gradle.kts",
              f"{root}/android/tenant-app/app/build.gradle.kts",
          }
          forbidden_parts = {".git", "node_modules", "sessions", "downloads", "logs", "tmp"}
          with zipfile.ZipFile(archive) as z:
              names = set()
              for info in z.infolist():
                  p = pathlib.PurePosixPath(info.filename)
                  if p.is_absolute() or ".." in p.parts:
                      sys.exit(f"Entrada ZIP insegura: {info.filename}")
                  if not p.parts or p.parts[0] != root:
                      sys.exit(f"Entrada fora da pasta esperada: {info.filename}")
                  if forbidden_parts.intersection(p.parts):
                      sys.exit(f"Conteúdo operacional não permitido no ZIP: {info.filename}")
                  base = p.name
                  if (base == ".env" or (base.startswith(".env.") and base != ".env.example")
                      or p.suffix.lower() in {".apk", ".aab", ".jks", ".keystore", ".pem", ".p12", ".pfx"}):
                      sys.exit(f"Possível segredo ou binário de release no ZIP: {info.filename}")
                  if not info.is_dir():
                      names.add(info.filename)
              missing = required - names
              if missing:
                  sys.exit("Faltam ficheiros obrigatórios: " + ", ".join(sorted(missing)))

              manifest_path = f"{root}/SHA256SUMS.txt"
              if manifest_path not in names:
                  sys.exit("Manifesto SHA256 ausente.")
              verified = set()
              for line in z.read(manifest_path).decode("utf-8").splitlines():
                  try:
                      expected_hash, rel = line.split("  ", 1)
                  except ValueError:
                      sys.exit("Linha inválida no manifesto SHA256.")
                  rel = rel.removeprefix("./")
                  entry = pathlib.PurePosixPath(rel)
                  if entry.is_absolute() or ".." in entry.parts:
                      sys.exit(f"Caminho inseguro no manifesto: {rel}")
                  internal = f"{root}/{rel}"
                  if internal not in names or internal == manifest_path:
                      sys.exit(f"Ficheiro do manifesto não existe: {rel}")
                  actual_hash = hashlib.sha256(z.read(internal)).hexdigest()
                  if actual_hash != expected_hash:
                      sys.exit(f"SHA256 divergente: {rel}")
                  verified.add(internal)
              expected_files = names - {manifest_path}
              if verified != expected_files:
                  missing_hashes = expected_files - verified
                  extra_hashes = verified - expected_files
                  sys.exit(f"Manifesto incompleto/inconsistente. Sem hash: {sorted(missing_hashes)[:10]}, extras: {sorted(extra_hashes)[:10]}")
          print(f"Arquivo validado: {len(verified)} hashes SHA256 corretos e sem padrões de segredos proibidos.")
          PY

          rm -rf /tmp/ursinho-import
          mkdir -p /tmp/ursinho-import
          unzip -q "$ARCHIVE" -d /tmp/ursinho-import
          SRC="/tmp/ursinho-import/URSINHO-X-BOT-AUTOMATION-v1.1.2"
          test -f "$SRC/platform/package.json"
          cp -a "$SRC/." ./
          rm -f "$ARCHIVE"

          # O checkout do GitHub tem um .git na raiz; isso não faz parte do pacote importado.
          # Ignorar apenas esse .git de checkout, continuando a rejeitar .git aninhados.
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          script = Path("platform/scripts/check-release-hygiene.js")
          source = script.read_text(encoding="utf-8")
          old = '    if (entry.isDirectory()) {\n      if (forbiddenDirs.has(entry.name)) {'
          new = '    if (entry.isDirectory()) {\n      if (relative === "" && entry.name === ".git") continue;\n      if (forbiddenDirs.has(entry.name)) {'
          if old not in source:
              raise SystemExit("Não foi possível aplicar a correção segura ao verificador de higiene.")
          script.write_text(source.replace(old, new, 1), encoding="utf-8")
          manifest = Path("SHA256SUMS.txt")
          lines = manifest.read_text(encoding="utf-8").splitlines()
          target = "platform/scripts/check-release-hygiene.js"
          updated = []
          found = False
          for line in lines:
              digest, rel = line.split("  ", 1)
              clean = rel.removeprefix("./")
              if clean == target:
                  digest = hashlib.sha256(script.read_bytes()).hexdigest()
                  found = True
              updated.append(f"{digest}  {rel}")
          if not found:
              raise SystemExit("O manifesto não contém o verificador de higiene.")
          manifest.write_text("\n".join(updated) + "\n", encoding="utf-8")
          PY

          # O preflight inclui higiene e deve correr antes de npm ci criar node_modules.
          # Guardar os workflows auxiliares como modelos, não como workflows ativos.
          # O token disponível ao runner não tem permissão "workflows" para os publicar.
          # Os testes e as compilações já são executados neste workflow principal.
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          workflow_dir = Path(".github/workflows")
          template_dir = Path("docs/ci-templates")
          template_dir.mkdir(parents=True, exist_ok=True)

          templates = {
              "backend-ci.yml": "docs/ci-templates/backend-ci.yml",
              "android-build.yml": "docs/ci-templates/android-build.yml",
          }
          for source_name, destination_name in templates.items():
              source = workflow_dir / source_name
              destination = Path(destination_name)
              if not source.is_file():
                  raise SystemExit(f"Modelo de CI ausente: {source}")
              destination.write_bytes(source.read_bytes())
              source.unlink()

          readme_updates = {
              Path("android/agent/README.md"): (
                  "- O workflow na raiz `.github/workflows/android-build.yml` compila o APK debug com GitHub Actions.",
                  "- O modelo de compilação está em `docs/ci-templates/android-build.yml`. A compilação também é executada pelo workflow principal `import-and-build.yml`."
              ),
              Path("android/tenant-app/README.md"): (
                  "- O workflow raiz `.github/workflows/android-build.yml` compila o APK debug. A compilação e instalação neste ambiente ainda não foram executadas.",
                  "- O modelo de compilação está em `docs/ci-templates/android-build.yml`. A compilação é executada pelo workflow principal `import-and-build.yml`; a instalação no dispositivo ainda não foi validada."
              ),
          }
          for path, (old, new) in readme_updates.items():
              original = path.read_text(encoding="utf-8")
              if old not in original:
                  raise SystemExit(f"Texto esperado não encontrado em {path}")
              path.write_text(original.replace(old, new, 1), encoding="utf-8")

          manifest = Path("SHA256SUMS.txt")
          updated_lines = []
          seen = set()
          for line in manifest.read_text(encoding="utf-8").splitlines():
              digest, original_rel = line.split("  ", 1)
              rel = original_rel.removeprefix("./")
              if rel.startswith(".github/workflows/"):
                  rel = "docs/ci-templates/" + rel.rsplit("/", 1)[1]
              target = Path(rel)
              if not target.is_file():
                  raise SystemExit(f"Ficheiro listado no manifesto não encontrado: {rel}")
              if rel in {
                  "android/agent/README.md",
                  "android/tenant-app/README.md",
                  "platform/scripts/check-release-hygiene.js",
              }:
                  digest = hashlib.sha256(target.read_bytes()).hexdigest()
              if rel in seen:
                  raise SystemExit(f"Caminho duplicado no manifesto: {rel}")
              seen.add(rel)
              updated_lines.append(f"{digest}  ./{rel}")
          required = set(templates.values()) | {
              "android/agent/README.md",
              "android/tenant-app/README.md",
              "platform/scripts/check-release-hygiene.js",
          }
          if not required.issubset(seen):
              raise SystemExit("Manifesto não cobre todos os ficheiros ajustados.")
          manifest.write_text("\n".join(updated_lines) + "\n", encoding="utf-8")
          PY
          sha256sum -c SHA256SUMS.txt

      - name: Confirmar que a fonte está disponível
        shell: bash
        run: |
          set -euo pipefail
          test -s platform/package.json
          test -s platform/package-lock.json
          test -f android/agent/app/build.gradle.kts
          test -f android/tenant-app/app/build.gradle.kts

      - name: Remover marcador ignorado da pasta de dados operacionais
        shell: bash
        run: |
          set -euo pipefail
          rm -f platform/data/.gitkeep
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("SHA256SUMS.txt")
          kept = []
          removed = 0
          for line in manifest.read_text(encoding="utf-8").splitlines():
              _, rel = line.split("  ", 1)
              if rel.removeprefix("./") == "platform/data/.gitkeep":
                  removed += 1
                  continue
              kept.append(line)
          if removed > 1:
              raise SystemExit("Entrada duplicada inesperada de platform/data/.gitkeep.")
          manifest.write_text("\n".join(kept) + "\n", encoding="utf-8")
          print("Marcador temporário de dados removido do pacote; diretório operacional permanece ignorado.")
          PY

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sincronizar package-lock com package.json
        working-directory: platform
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verificar lockfile e atualizar o manifesto SHA256
        shell: bash
        run: |
          set -euo pipefail
          npm ci --dry-run --ignore-scripts --no-audit --no-fund --prefix platform
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          manifest = Path("SHA256SUMS.txt")
          target = Path("platform/package-lock.json")
          if not target.is_file():
              raise SystemExit("package-lock.json não foi gerado.")
          lines = []
          found = False
          for line in manifest.read_text(encoding="utf-8").splitlines():
              digest, rel = line.split("  ", 1)
              if rel.removeprefix("./") == "platform/package-lock.json":
                  digest = hashlib.sha256(target.read_bytes()).hexdigest()
                  found = True
              lines.append(f"{digest}  {rel}")
          if not found:
              raise SystemExit("package-lock.json não está listado no manifesto SHA256.")
          manifest.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          sha256sum -c SHA256SUMS.txt

      - name: Verificar higiene antes de publicar código no repositório público
        working-directory: platform
        run: node scripts/check-release-hygiene.js

      - name: Pré-validar Backend antes de instalar dependências
        working-directory: platform
        run: npm run preflight

      - name: Publicar a fonte completa no branch main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import URSINHO X BOT AUTOMATION v1.1.2 audited source"
            git push origin HEAD:main
          else
            echo "Não há alterações novas para publicar."
          fi

      - name: Ativar cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-${{ hashFiles('platform/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-

      - name: Instalar dependências bloqueadas
        working-directory: platform
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Repetir testes Node.js após instalar dependências
        working-directory: platform
        run: |
          npm test
          npm run check

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar Android SDK 35 e Build Tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Testar e compilar Android Agent
        working-directory: android/agent
        run: gradle testDebugUnitTest assembleDebug

      - name: Compilar Tenant Android App
        working-directory: android/tenant-app
        run: gradle assembleDebug

      - name: Guardar APKs de teste
        uses: actions/upload-artifact@v4
        with:
          name: URSINHO-X-APKs-DEBUG-v1.1.2
          path: |
            android/agent/app/build/outputs/apk/debug/*.apk
            android/tenant-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
