name: Android APKs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apks:
    name: Test Agent e compilar os dois APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Instalar Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Testar e compilar Android Agent
        working-directory: android/agent
        run: gradle testDebugUnitTest assembleDebug
      - name: Compilar Tenant App
        working-directory: android/tenant-app
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ursinho-x-apks-debug
          path: |
            android/agent/app/build/outputs/apk/debug/*.apk
            android/tenant-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
